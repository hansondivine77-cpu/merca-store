
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c15">
<title>MERCA — Discover Something Exceptional</title>
<style>
:root {
  --bg:#090c15;
  --surface:#111725;
  --surface2:#171f30;
  --line:rgba(190,205,255,.10);
  --muted:#929bb1;
  --white:#f6f7fc;
  --cyan:#50d9ed;
  --purple:#9067ff;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}
button,input {font:inherit}
button {cursor:pointer}
.app {
  width:100%;
  max-width:560px;
  min-height:100vh;
  margin:auto;
  padding-bottom:110px;
  background:
    radial-gradient(ellipse at 90% 0%,rgba(57,93,151,.13),transparent 35%),
    var(--bg);
}
header {
  padding:24px 21px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo {
  font-size:25px;
  font-weight:850;
  letter-spacing:3px;
}
.logo span {color:var(--cyan)}
.header-actions {display:flex;gap:10px}
.round-btn {
  width:43px;height:43px;
  border:1px solid var(--line);
  border-radius:50%;
  background:linear-gradient(145deg,#1c2638,#111725);
  color:white;font-size:18px;
}
main {padding:15px 20px 25px}
.eyebrow {
  color:#9ca8c0;
  font-size:13px;
  letter-spacing:1.3px;
  margin-bottom:7px;
}
.heading-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
h1 {
  font-size:30px;
  line-height:1.12;
  letter-spacing:-1px;
  margin:0 0 21px;
}
.search-row {display:flex;gap:10px;margin-bottom:18px}
.search-wrap {
  flex:1;
  display:flex;align-items:center;gap:10px;
  background:#171e2e;
  border:1px solid var(--line);
  border-radius:15px;
  padding:0 14px;
  min-width:0;
}
.search-wrap span {font-size:20px;color:#aeb9ce}
.search-wrap input {
  width:100%;height:51px;
  background:transparent;border:0;outline:0;
  color:white;font-size:14px;
}
.search-wrap input::placeholder {color:#818ba2}
.filter-btn {
  width:53px;border-radius:15px;
  border:1px solid var(--line);
  color:#eaf1ff;background:#171e2e;
  font-size:20px;
}
.categories {
  display:flex;gap:9px;overflow-x:auto;
  scrollbar-width:none;padding-bottom:5px;
  margin-bottom:20px;
}
.categories::-webkit-scrollbar {display:none}
.chip {
  white-space:nowrap;border:1px solid transparent;
  border-radius:30px;padding:11px 17px;
  background:#171d2b;color:#aeb6c8;
  font-size:13px;
}
.chip.active {
  color:white;
  background:linear-gradient(110deg,#238cf1,#7650ee);
  box-shadow:0 5px 20px rgba(73,103,255,.22);
}
.hero {
  min-height:190px;
  position:relative;overflow:hidden;
  border:1px solid rgba(183,198,255,.12);
  border-radius:21px;
  padding:25px 22px;
  margin-bottom:29px;
  background:
    radial-gradient(ellipse at 85% 70%,rgba(99,74,190,.34),transparent 42%),
    linear-gradient(120deg,#1a2437,#111725 65%,#17172c);
}
.hero:after {
  content:"✦";
  position:absolute;right:22px;top:13px;
  font-size:120px;line-height:1;
  color:rgba(111,159,255,.12);
  text-shadow:0 0 45px rgba(85,130,255,.35);
}
.hero-content {position:relative;z-index:1;max-width:70%}
.hero small {
  color:#9eafd1;letter-spacing:1.8px;
  font-size:10px;font-weight:700;
}
.hero h2 {
  font-size:25px;line-height:1.15;
  margin:13px 0 8px;letter-spacing:-.6px;
}
.hero p {
  color:#aab5ca;font-size:12px;line-height:1.5;
  margin:0 0 16px;
}
.primary-btn {
  border:0;border-radius:30px;padding:12px 18px;
  color:white;font-weight:650;font-size:12px;
  background:linear-gradient(105deg,#168eea,#8249e9);
  box-shadow:0 5px 22px rgba(83,88,242,.25);
}
.hero-orb {
  position:absolute;right:-28px;bottom:-52px;
  width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(75,219,244,.25),rgba(103,73,207,.18) 35%,transparent 70%);
  filter:blur(5px);
}
.section-head {
  display:flex;justify-content:space-between;
  align-items:center;margin:0 0 15px;
}
.section-head h2 {font-size:18px;margin:0;letter-spacing:-.3px}
.section-head button {
  border:0;background:none;color:#9ba7bd;font-size:12px;
}
.product-grid {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.product {
  min-width:0;overflow:hidden;
  border:1px solid var(--line);
  border-radius:17px;
  background:linear-gradient(145deg,#171f30,#101622);
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}
.product-art {
  height:133px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 75%,var(--glow),transparent 65%),
    linear-gradient(145deg,#1b263a,#111725);
}
.product-art .symbol {
  font-size:58px;
  filter:drop-shadow(0 12px 15px rgba(0,0,0,.4));
}
.product-art:after {
  content:"";position:absolute;
  width:120px;height:120px;border-radius:50%;
  border:1px solid rgba(255,255,255,.06);
}
.product-info {padding:12px}
.product h3 {font-size:14px;margin:0 0 6px}
.product p {
  font-size:11px;color:var(--muted);
  margin:0 0 13px;line-height:1.4;
  min-height:30px;
}
.product-bottom {
  display:flex;justify-content:space-between;
  align-items:center;gap:5px;
}
.product-type {font-size:10px;color:#91d9ed}
.add-btn {
  border:1px solid rgba(151,169,255,.13);
  border-radius:20px;padding:8px 11px;
  background:linear-gradient(120deg,#202b42,#28213d);
  color:#f4f4ff;font-size:11px;
}
.add-btn:active {transform:scale(.96)}
.empty {
  grid-column:1/-1;text-align:center;
  padding:35px 10px;color:var(--muted);
  font-size:13px;
}
.cart-bar {
  position:fixed;z-index:5;
  bottom:76px;left:50%;transform:translateX(-50%);
  width:calc(100% - 30px);max-width:530px;
  padding:10px 12px;border-radius:19px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;background:rgba(27,34,52,.96);
  border:1px solid rgba(186,203,255,.13);
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  backdrop-filter:blur(18px);
}
.cart-info {display:flex;align-items:center;gap:9px}
.cart-icon {
  width:39px;height:39px;border-radius:50%;
  display:grid;place-items:center;
  background:#29334a;font-size:17px;
}
.cart-count {font-size:12px;color:#c2cadd}
.cart-total {font-size:14px;font-weight:750}
.checkout-btn {
  border:0;border-radius:25px;padding:12px 18px;
  color:white;font-size:12px;font-weight:700;
  background:linear-gradient(105deg,#168eea,#9846e9);
}
.bottom-nav {
  position:fixed;z-index:6;bottom:0;left:50%;
  transform:translateX(-50%);
  width:100%;max-width:560px;
  padding:10px 8px calc(12px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;
  background:rgba(13,17,28,.96);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
}
.nav-item {
  flex:1;border:0;background:none;color:#8791a8;
  display:flex;flex-direction:column;align-items:center;
  gap:5px;font-size:10px;padding:3px;
}
.nav-item .nav-icon {font-size:21px;line-height:1.2}
.nav-item.active {color:#a48aff}
.nav-item.active .nav-icon {filter:drop-shadow(0 0 8px #9b68ff)}
.toast {
  position:fixed;z-index:10;top:18px;left:50%;
  transform:translateX(-50%);
  background:#222d42;color:white;
  border:1px solid var(--line);border-radius:30px;
  padding:11px 17px;font-size:12px;
  opacity:0;pointer-events:none;transition:.2s;
}
.toast.show {opacity:1}
@media(min-width:500px) {
  .product-grid {grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">MERC<span>A</span></div>
    <div class="header-actions">
      <button class="round-btn" aria-label="Wishlist" onclick="showToast('Your wishlist is coming soon')">♡</button>
      <button class="round-btn" aria-label="Cart" onclick="showCart()">♧</button>
    </div>
  </header>

  <main>
    <div class="eyebrow">YOUR DIGITAL DESTINATION</div>
    <div class="heading-row">
      <h1>Discover<br>Premium Finds</h1>
    </div>

    <div class="search-row">
      <label class="search-wrap">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search digital products..." oninput="renderProducts()">
      </label>
      <button class="filter-btn" aria-label="Filter" onclick="showToast('More filters coming soon')">☷</button>
    </div>

    <div class="categories" id="categories">
      <button class="chip active" data-category="All">All</button>
      <button class="chip" data-category="E-books">E-books</button>
      <button class="chip" data-category="Templates">Templates</button>
      <button class="chip" data-category="Study">Study</button>
      <button class="chip" data-category="Tools">Digital tools</button>
    </div>

    <section class="hero">
      <div class="hero-orb"></div>
      <div class="hero-content">
        <small>THE MERCA COLLECTION</small>
        <h2>Something<br>worth discovering.</h2>
        <p>Thoughtfully selected digital products for everyday life.</p>
        <button class="primary-btn" onclick="document.getElementById('featured').scrollIntoView({behavior:'smooth'})">Explore collection&nbsp; →</button>
      </div>
    </section>

    <div class="section-head" id="featured">
      <h2>Featured collection</h2>
      <button onclick="setCategory('All')">View all&nbsp; →</button>
    </div>

    <div class="product-grid" id="products"></div>
  </main>
</div>

<div class="cart-bar" id="cartBar" hidden>
  <div class="cart-info">
    <div class="cart-icon">🛍</div>
    <div>
      <div class="cart-count" id="cartCount">0 items</div>
      <div class="cart-total" id="cartTotal">Your bag</div>
    </div>
  </div>
  <button class="checkout-btn" onclick="showToast('Checkout will be available when the store launches')">View bag&nbsp; →</button>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="navTo('Home',this)"><span class="nav-icon">⌂</span>Home</button>
  <button class="nav-item" onclick="navTo('Categories',this)"><span class="nav-icon">▦</span>Categories</button>
  <button class="nav-item" onclick="navTo('Orders',this)"><span class="nav-icon">▤</span>Orders</button>
  <button class="nav-item" onclick="navTo('Wishlist',this)"><span class="nav-icon">♡</span>Wishlist</button>
  <button class="nav-item" onclick="navTo('Profile',this)"><span class="nav-icon">♙</span>Profile</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const products = [
  {name:"The Everyday Guide",desc:"A practical digital reading guide",category:"E-books",icon:"📖",glow:"rgba(77,190,224,.28)"},
  {name:"CV Design Collection",desc:"Clean and professional CV layouts",category:"Templates",icon:"📄",glow:"rgba(135,105,255,.3)"},
  {name:"Creative Design Pack",desc:"Resources for your next project",category:"Templates",icon:"✦",glow:"rgba(66,159,245,.3)"},
  {name:"Study Companion",desc:"Organised learning resources",category:"Study",icon:"🎓",glow:"rgba(66,202,190,.25)"},
  {name:"Daily Planner",desc:"A calmer way to organise your day",category:"Tools",icon:"▤",glow:"rgba(153,113,255,.3)"},
  {name:"Digital Toolkit",desc:"Useful tools in one collection",category:"Tools",icon:"◇",glow:"rgba(61,172,224,.3)"}
];
let activeCategory="All";
let cart=[];

function renderProducts(){
  const query=document.getElementById("search").value.toLowerCase();
  const shown=products.filter(p=>
    (activeCategory==="All"||p.category===activeCategory)&&
    (p.name+" "+p.desc+" "+p.category).toLowerCase().includes(query)
  );
  const area=document.getElementById("products");
  area.innerHTML="";
  if(!shown.length){
    area.innerHTML='<div class="empty">No matching products found.</div>';
    return;
  }
  shown.forEach(p=>{
    const card=document.createElement("article");
    card.className="product";
    card.innerHTML=`
      <div class="product-art" style="--glow:${p.glow}">
        <span class="symbol">${p.icon}</span>
      </div>
      <div class="product-info">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="product-bottom">
          <span class="product-type">${p.category}</span>
          <button class="add-btn">＋ Add</button>
        </div>
      </div>`;
    card.querySelector("button").onclick=()=>addToCart(p);
    area.appendChild(card);
  });
}
function setCategory(category){
  activeCategory=category;
  document.querySelectorAll(".chip").forEach(b=>
    b.classList.toggle("active",b.dataset.category===category)
  );
  renderProducts();
}
document.getElementById("categories").addEventListener("click",e=>{
  const b=e.target.closest(".chip");
  if(b)setCategory(b.dataset.category);
});
function addToCart(product){
  cart.push(product);
  document.getElementById("cartBar").hidden=false;
  document.getElementById("cartCount").textContent=cart.length+" item"+(cart.length===1?"":"s");
  document.getElementById("cartTotal").textContent="Bag updated";
  showToast(product.name+" added to your bag");
}
function showCart(){
  if(!cart.length){showToast("Your bag is empty");return;}
  showToast(cart.length+" item(s) in your bag");
}
function navTo(name,button){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  if(name==="Home"){window.scrollTo({top:0,behavior:"smooth"});return;}
  if(name==="Categories"){document.getElementById("categories").scrollIntoView({behavior:"smooth"});return;}
  showToast(name+" will be available when MERCA launches");
}
function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}
renderProducts();
</script>
</body>
  </html>
